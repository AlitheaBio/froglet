name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 3 * * *'  # Nightly at 03:17 UTC

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  strict-checks:
    name: Strict Checks
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r python/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            integrations/mcp/froglet/package-lock.json

      - name: Install root MCP package dependencies
        run: npm ci

      - name: Install MCP server dependencies
        run: npm ci --prefix integrations/mcp/froglet

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit

      - name: Audit npm dependencies
        run: |
          npm audit --audit-level=high
          npm audit --prefix integrations/mcp/froglet --audit-level=high

      - name: Run strict verification matrix
        env:
          RUST_TEST_THREADS: '4'
          FROGLET_REQUIRE_SOFTWARE_CHECKS: '1'
          FROGLET_RUN_LINUX_SANDBOX_TESTS: '1'
        run: ./scripts/strict_checks.sh

  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [strict-checks]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.91.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked --quiet

      - name: Generate coverage report
        # LLVM instrumentation, not tarpaulin's x86_64 default (ptrace). Ptrace
        # traces every forked child and aborts the whole run on any SIGSEGV,
        # including the one the kernel sends a worker exec'd under a 1-byte
        # RLIMIT_AS (builtin_worker address-space test). Its breakpoint traps
        # also push 1s execution deadlines past their limit.
        run: cargo tarpaulin --engine llvm --workspace --out xml --skip-clean --timeout 300

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: cobertura.xml

  binary-install-smoke:
    name: Binary Install Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [strict-checks]

    steps:
      - name: Check out repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.91.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Derive release tag
        id: release_meta
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          print(f"tag=v{version}")
          PY

      - name: Build release binaries
        run: |
          cargo build --release --locked --bin froglet-node -p froglet

      - name: Package release archives
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          mkdir -p dist
          ./scripts/package_release_assets.sh \
            --version "$RELEASE_TAG" \
            --platform linux \
            --arch x86_64 \
            --out-dir dist
          (cd dist && sha256sum froglet-*.tar.gz agent-bootstrap.sh > SHA256SUMS)
          ./scripts/verify_release_assets.sh --dir dist --version "$RELEASE_TAG" --target linux:x86_64

      - name: Smoke test one-line installer from packaged assets
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: ./scripts/smoke_install_from_assets.sh --assets-dir dist --version "$RELEASE_TAG"

  docs-site:
    name: Docs Site
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs site dependencies
        run: npm ci --prefix docs-site

      - name: Set up Rust for browser verification
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.91.0
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Build the locked browser WebAssembly (verifier, playground kernel, sample services)
        run: npm run build:wasm --prefix docs-site

      - name: Verify browser WebAssembly across checkout paths and a fresh target cache
        run: node docs-site/scripts/check-wasm-reproducibility.mjs --output "$RUNNER_TEMP/froglet-wasm-reproducibility"

      - name: Build the node for browser interoperability tests
        run: cargo build --locked -p froglet --bin froglet-node

      - name: Build docs site
        env:
          SITE_URL: https://froglet.dev
        run: npm run build --prefix docs-site

      - name: Run docs site tests
        env:
          FROGLET_PLAYGROUND_REAL_PROVIDER: '1'
          FROGLET_PLAYGROUND_REAL_REQUESTER: '1'
          FROGLET_PUBLIC_DEMO_REAL_NODE: '1'
          FROGLET_NODE_BIN: ${{ github.workspace }}/target/debug/froglet-node
        run: npm test --prefix docs-site

      - name: Audit docs dependencies and verify advisory applicability
        run: node docs-site/scripts/audit-dependencies.mjs

  openclaw-node18:
    name: OpenClaw Node 18
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "18"

      - name: Verify OpenClaw plugin on supported minimum Node
        run: |
          node --check integrations/openclaw/froglet/index.js
          node --check integrations/openclaw/froglet/scripts/doctor.mjs
          node --test integrations/openclaw/froglet/test/plugin.test.js \
            integrations/openclaw/froglet/test/*.test.mjs

  docker-compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Pin the compose project so the network name (froglet_default) is
      # deterministic for the dockerized MCP smoke below.
      COMPOSE_PROJECT_NAME: froglet

    steps:
      - name: Check out repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integrations/mcp/froglet/package-lock.json

      - name: Install MCP server dependencies
        run: npm ci --prefix integrations/mcp/froglet

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build images
        run: docker compose build provider runtime

      - name: Start stack
        run: docker compose up -d --wait provider runtime

      - name: Wait for provider health
        run: curl --retry 20 --retry-connrefused --retry-delay 2 --fail --silent --show-error http://127.0.0.1:8080/health

      - name: Wait for runtime health
        run: curl --retry 20 --retry-connrefused --retry-delay 2 --fail --silent --show-error http://127.0.0.1:8081/health

      - name: Verify provider descriptor and runtime token
        run: |
          # Runtime auth token stays 0o600 even in host-readable mode (a
          # deliberate invariant: leaking it to the host would let any host
          # user authenticate as a runtime client). Read it via docker exec
          # from inside the container to verify existence + non-emptiness
          # without relaxing the invariant.
          docker compose exec -T runtime test -s /data/runtime/auth.token \
            || { echo "runtime auth token missing or empty"; exit 1; }

          python3 - <<'PY'
          import json
          import urllib.request

          def get_json(url: str) -> dict:
              with urllib.request.urlopen(url) as response:
                  return json.load(response)

          descriptor = get_json("http://127.0.0.1:8080/v1/provider/descriptor")
          endpoints = descriptor["payload"]["transport_endpoints"]
          assert any(
              endpoint["uri"] == "http://provider:8080" for endpoint in endpoints
          ), endpoints

          runtime_health = get_json("http://127.0.0.1:8081/health")
          assert runtime_health.get("status") in ("ok", "healthy", True, "up"), runtime_health
          PY

      - name: Stage control tokens for host-side agent smokes
        run: |
          docker compose exec -T provider cat /data/runtime/froglet-control.token > "$RUNNER_TEMP/froglet-provider-control.token"
          docker compose exec -T runtime cat /data/runtime/auth.token > "$RUNNER_TEMP/froglet-runtime-auth.token"
          chmod 0600 "$RUNNER_TEMP/froglet-provider-control.token" "$RUNNER_TEMP/froglet-runtime-auth.token"

      - name: Smoke test OpenClaw plugin against compose-backed Froglet
        env:
          FROGLET_PROVIDER_AUTH_TOKEN_PATH: ${{ runner.temp }}/froglet-provider-control.token
          FROGLET_RUNTIME_AUTH_TOKEN_PATH: ${{ runner.temp }}/froglet-runtime-auth.token
        run: node integrations/openclaw/froglet/test/compose-smoke.mjs

      - name: Smoke test MCP server against compose-backed Froglet
        env:
          FROGLET_PROVIDER_AUTH_TOKEN_PATH: ${{ runner.temp }}/froglet-provider-control.token
          FROGLET_PROVIDER_CONTROL_TOKEN_PATH: ${{ runner.temp }}/froglet-provider-control.token
          FROGLET_RUNTIME_AUTH_TOKEN_PATH: ${{ runner.temp }}/froglet-runtime-auth.token
        run: node integrations/mcp/froglet/test/compose-smoke.mjs

      - name: Build MCP image with bundled froglet-node
        run: |
          docker build \
            -f integrations/mcp/froglet/Dockerfile \
            --build-arg FROGLET_NODE_IMAGE=froglet-provider:local \
            -t froglet-mcp:local \
            .

      - name: Verify froglet-node runs inside the MCP image
        run: docker run --rm --entrypoint /usr/local/bin/froglet-node froglet-mcp:local help

      - name: Stage tokens for dockerized MCP smoke
        run: |
          mkdir -p "$RUNNER_TEMP/froglet-tokens"
          docker compose exec -T provider cat /data/runtime/froglet-control.token > "$RUNNER_TEMP/froglet-tokens/froglet-control.token"
          docker compose exec -T runtime cat /data/runtime/auth.token > "$RUNNER_TEMP/froglet-tokens/auth.token"
          # World-readable on purpose: the MCP container reads these as uid
          # 10001 and RUNNER_TEMP is ephemeral CI scratch space.
          chmod 0644 "$RUNNER_TEMP"/froglet-tokens/*.token

      - name: Smoke test dockerized MCP image (marketplace_publish regression)
        env:
          FROGLET_MCP_SMOKE_COMMAND: docker
          FROGLET_MCP_SMOKE_ARGS: '["run","--rm","-i","--network","froglet_default","-v","${{ runner.temp }}/froglet-tokens:/froglet-tokens:ro","-e","FROGLET_PROVIDER_URL","-e","FROGLET_RUNTIME_URL","-e","FROGLET_PROVIDER_AUTH_TOKEN_PATH","-e","FROGLET_RUNTIME_AUTH_TOKEN_PATH","-e","FROGLET_DAEMON_URL","-e","FROGLET_PROVIDER_CONTROL_TOKEN_PATH","-e","FROGLET_REQUEST_TIMEOUT_MS","froglet-mcp:local"]'
          FROGLET_PROVIDER_URL: http://provider:8080
          FROGLET_RUNTIME_URL: http://runtime:8081
          FROGLET_DAEMON_URL: http://provider:8080
          FROGLET_PROVIDER_AUTH_TOKEN_PATH: /froglet-tokens/froglet-control.token
          FROGLET_RUNTIME_AUTH_TOKEN_PATH: /froglet-tokens/auth.token
          FROGLET_PROVIDER_CONTROL_TOKEN_PATH: /froglet-tokens/froglet-control.token
          FROGLET_MCP_SMOKE_EXPECT_PUBLISH: "1"
        run: node integrations/mcp/froglet/test/compose-smoke.mjs

      - name: Show container status
        if: always()
        run: docker compose ps

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color provider runtime

      - name: Stop stack
        if: always()
        run: docker compose down -v

  extended-local:
    name: Extended Local Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [strict-checks]

    steps:
      - name: Check out repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r python/requirements.txt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Run fuzz tests
        run: ./scripts/test_suite.sh fuzz

      - name: Run black box tests
        run: ./scripts/test_suite.sh blackbox

      - name: Run penetration tests
        run: ./scripts/test_suite.sh pentest

      - name: Run sanity tests
        run: ./scripts/test_suite.sh sanity
